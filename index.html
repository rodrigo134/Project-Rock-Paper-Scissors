<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Jokenpo Corrigido</title>
    <style>
        .result p {
            color: black;
            background-color: rgb(82, 215, 75);
            min-height: 1.5em;
            margin: 5px 0;
            padding: 4px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Rock, Paper, Scissors. </h1>

    <div class="buttons">
        <button>Paper</button>
        <button>Rock</button>
        <button>Scissors</button>
    </div>

    <div class="result">
        <p class="message"></p> <!-- Mensagem de resultado da rodada -->
        <p class="score"></p> <!-- Placar -->
        <p class="choices"></p> <!-- Escolhas -->
    </div>

    <script src="app.js"></script>
</body>

</html>
